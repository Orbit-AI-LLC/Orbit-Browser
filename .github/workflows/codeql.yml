name: CodeQL

# Code scanning for Orbit Browser's own code. The repository's code is the
# Python build tooling (scripts/) and the GitHub Actions workflows; the C++ is
# Chromium's, which lives in the gitignored src/ checkout and is never committed
# here (and could not be built under CodeQL autobuild anyway — it is a multi-hour
# Chromium compile). So this analyses python and actions, not cpp.
#
# This is an "advanced" CodeQL setup (a committed workflow). It replaces GitHub's
# default setup: turn default setup off in Settings → Code security → Code
# scanning, or the two conflict. When Orbit's own C++ component lands
# (chromium_src/chrome/browser/orbit/), it still can't be analysed in CI without
# the Chromium build, so cpp stays out of this matrix on purpose.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
