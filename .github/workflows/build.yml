name: Build and release

# Orbit Browser repacks ungoogled-chromium (scripts/build.py): download the
# pinned build, change what needs no compiler (name, icon, policies, first-run
# preferences, Orbit Pass), repackage. It is fast and runs on standard
# GitHub-hosted runners.
#
#   - config + signature tests: every push and PR.
#   - a daily check that chromium.json is near the newest ungoogled-chromium.
#   - build + publish: every push to main (prerelease) and every v* tag (release),
#     plus manual dispatch.
#
# Orbit Browser has its own version, VERSION in scripts/orbit_config.py; a tag
# must be it (v0.1.0). Installed browsers update from these releases through Orbit
# Mission Control, once the release carries signatures made with Orbit Browser's
# update key (a Tauri signing key, as in the other Orbit apps):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Orbit Pass is bundled from its own private repository:
#   ORBIT_PASS_TOKEN            read-only Contents on Orbit-AI-LLC/Orbit-Pass
# The Mac app is signed and notarized with the Developer ID secrets (as Orbit Pass):
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_TEAM_ID,
#   NOTARY_APPLE_ID, NOTARY_PASSWORD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium is current
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare with the newest ungoogled-chromium
        run: |
          pinned=$(python3 -c 'import json; print(json.load(open("chromium.json")).get("version") or "none")')
          latest=$(curl -fsSL -H "Accept: application/vnd.github+json" https://api.github.com/repos/ungoogled-software/ungoogled-chromium/tags | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["name"])')
          if [ "$pinned" != "$latest" ]; then
            echo "::warning::ungoogled-chromium $latest is out and Orbit Browser pins $pinned. Run scripts/update_chromium.py with the new URLs."
          else
            echo "Orbit Browser pins ungoogled-chromium $pinned."
          fi

  tests:
    name: Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography
      - run: python3 -m unittest discover -s tests

  version:
    name: Version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Name the build
        id: meta
        run: |
          base=$(cd scripts && python3 -c 'import orbit_config; print(orbit_config.orbit_version(0, True))')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$base" ]; then
              echo "::error::The tag is v$version but scripts/orbit_config.py has VERSION $base; tag v$base or change VERSION."
              exit 1
            fi
            echo "release=--release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Orbit Browser $version" >> "$GITHUB_OUTPUT"
          else
            version="${base}-build.${GITHUB_RUN_NUMBER}"
            echo "release=" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Orbit Browser ${base} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: [version, tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            platforms: --platform linux
          - name: windows
            os: windows-latest
            platforms: --platform win64
          - name: mac
            os: macos-latest
            platforms: --platform mac-arm64 --platform mac-x64
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: Orbit-AI-LLC/Orbit-Pass
          token: ${{ secrets.ORBIT_PASS_TOKEN }}
          path: orbit-pass
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Load the Developer ID (mac)
        if: matrix.name == 'mac' && env.MACOS_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        run: >
          python3 scripts/build.py ${{ matrix.platforms }}
          --orbit-pass orbit-pass --build ${{ needs.version.outputs.build }}
          ${{ needs.version.outputs.release }}
          ${SIGN_IDENTITY:+--sign "$SIGN_IDENTITY"}
      - name: Notarize (mac)
        if: matrix.name == 'mac' && env.MACOS_CERTIFICATE_P12 != ''
        shell: bash
        run: |
          for dmg in dist/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: Orbit-Browser-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: Orbit-Browser-*
          path: artifacts
          merge-multiple: true
      - name: Sign the updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography
          shopt -s nullglob
          python3 scripts/sign_update.py --version "${{ needs.version.outputs.version }}" artifacts/*.app.tar.gz artifacts/*.tar.xz artifacts/*.zip
      - name: Write the update manifest
        run: |
          python3 .github/scripts/orbit_update_manifest.py artifacts \
            --version "${{ needs.version.outputs.version }}" \
            --build "${{ needs.version.outputs.build }}" \
            --commit "$GITHUB_SHA"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
