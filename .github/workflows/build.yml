name: Build and release

# Orbit Browser is a source fork of Chromium (scripts/build.py): the compile is
# tens of GB of source and hours per platform, far past a GitHub-hosted runner's
# disk and time, so the build and release jobs run on self-hosted runners
# labelled [self-hosted, orbit-browser, <os>] with depot_tools' prerequisites
# and a persistent .cache/ + src/ checkout. Pushes and pull requests still run
# the fast checks (config and update signatures) on hosted runners.
#
#   - config + signature tests: every push and PR (hosted).
#   - a daily check that chromium.json is the newest stable Chromium.
#   - build + publish: every push to main (prerelease) and every v* tag
#     (release), plus manual dispatch (self-hosted runners).
#
# Orbit Browser has its own version, VERSION in scripts/orbit_config.py; a tag
# must be it (v0.1.0). Installed browsers update themselves from these releases
# through Orbit Mission Control, once the release carries signatures made with
# Orbit Browser's update key (a Tauri signing key, as in the other Orbit apps):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
# Orbit Pass is built in from its own private repository:
#   ORBIT_PASS_TOKEN            read-only Contents on Orbit-AI-LLC/Orbit-Pass
# The Mac app is signed and notarized with the Developer ID secrets (as Orbit Pass):
#   MACOS_CERTIFICATE_P12, MACOS_CERTIFICATE_PASSWORD, APPLE_TEAM_ID,
#   NOTARY_APPLE_ID, NOTARY_PASSWORD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium is current
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare with the newest stable Chromium
        run: |
          pinned=$(python3 -c 'import json; print(json.load(open("chromium.json"))["version"])')
          latest=$(curl -fsSL "https://chromiumdash.appspot.com/fetch_releases?channel=Stable&platform=Mac&num=1" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["version"])')
          if [ "$pinned" != "$latest" ]; then
            echo "::warning::Chromium $latest is stable and Orbit Browser is on $pinned. Run python3 scripts/update_chromium.py, re-anchor any failing patch, and push."
          else
            echo "Orbit Browser is on Chromium $pinned, the newest stable."
          fi

  tests:
    name: Tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography
      # The committed config (pin, GN args, branding, policies) and the shared
      # update-signature protocol. No source tree or compiler needed.
      - run: python3 -m unittest discover -s tests

  version:
    name: Version
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the build
        id: meta
        run: |
          base=$(cd scripts && python3 -c 'import orbit_config; print(orbit_config.orbit_version(0, True))')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [ "$version" != "$base" ]; then
              echo "::error::The tag is v$version but scripts/orbit_config.py has VERSION $base; tag v$base or change VERSION."
              exit 1
            fi
            echo "release=--release" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "name=Orbit Browser $version" >> "$GITHUB_OUTPUT"
          else
            version="${base}-build.${GITHUB_RUN_NUMBER}"
            echo "release=" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "name=Orbit Browser ${base} build ${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: [version, tests]
    # Every push to main and every v* tag (and manual runs) builds. The Chromium
    # compile only runs on a self-hosted runner with the source checkout; it is
    # too large and slow for a hosted runner, so these runners must exist (labels
    # below) or the jobs queue. Pull requests build nothing (tests only).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            runner: [self-hosted, orbit-browser, macos]
          - platform: win64
            runner: [self-hosted, orbit-browser, windows]
          - platform: linux
            runner: [self-hosted, orbit-browser, linux]
    runs-on: ${{ matrix.runner }}
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Orbit-AI-LLC/Orbit-Pass
          token: ${{ secrets.ORBIT_PASS_TOKEN }}
          path: orbit-pass
      - name: Load the Developer ID (mac)
        if: matrix.platform == 'mac' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/build.keychain-db"
          password="$(uuidgen)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
      - name: Build
        run: >
          python3 scripts/build.py --platform ${{ matrix.platform }}
          --orbit-pass orbit-pass --build ${{ needs.version.outputs.build }}
          ${{ needs.version.outputs.release }}
          ${SIGN_IDENTITY:+--sign "$SIGN_IDENTITY"}
      - name: Notarize (mac)
        if: matrix.platform == 'mac' && env.MACOS_CERTIFICATE_P12 != ''
        run: |
          dmg=$(ls dist/*.dmg)
          xcrun notarytool submit "$dmg" --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: Orbit-Browser-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    # A push to main publishes a prerelease (0.1.0-build.N); a v* tag publishes a
    # release. The version job sets prerelease accordingly.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          pattern: Orbit-Browser-*
          path: artifacts
          merge-multiple: true
      - name: Sign the updates
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-cryptography
          python3 scripts/sign_update.py --version "${{ needs.version.outputs.version }}" artifacts/*.app.tar.gz artifacts/*-Setup.exe artifacts/*.tar.xz
      - name: Write the update manifest
        run: |
          python3 .github/scripts/orbit_update_manifest.py artifacts \
            --version "${{ needs.version.outputs.version }}" \
            --build "${{ needs.version.outputs.build }}" \
            --commit "$GITHUB_SHA"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.name }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: artifacts/*
